<svg xmlns="http://www.w3.org/2000/svg" width="880" height="616" viewBox="0 0 880 616" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#1f2328"/></marker><marker id="arrow-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#6e7781"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#b42318"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#9a5b00"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#1f5f99"/></marker></defs>
<rect width="880" height="616" fill="white"/>
<line x1="80" y1="50" x2="80" y2="532" stroke="#6e7781" stroke-width="1.0" stroke-dasharray="6 4"/>
<rect x="10" y="12" width="140" height="38" rx="7" fill="#ffffff" stroke="#1f2328" stroke-width="1.4"/>
<text x="80.0" y="36.0" font-size="14.5" text-anchor="middle" fill="#1f2328" font-weight="bold">Storefront</text>

<line x1="250" y1="50" x2="250" y2="532" stroke="#6e7781" stroke-width="1.0" stroke-dasharray="6 4"/>
<rect x="180" y="12" width="140" height="38" rx="7" fill="#ffffff" stroke="#b42318" stroke-width="1.4"/>
<text x="250.0" y="36.0" font-size="14.5" text-anchor="middle" fill="#b42318" font-weight="bold">Order</text>

<line x1="430" y1="50" x2="430" y2="532" stroke="#6e7781" stroke-width="1.0" stroke-dasharray="6 4"/>
<rect x="360" y="12" width="140" height="38" rx="7" fill="#ffffff" stroke="#b42318" stroke-width="1.4"/>
<text x="430.0" y="36.0" font-size="14.5" text-anchor="middle" fill="#b42318" font-weight="bold">Inventory</text>

<line x1="610" y1="50" x2="610" y2="532" stroke="#6e7781" stroke-width="1.0" stroke-dasharray="6 4"/>
<rect x="540" y="12" width="140" height="38" rx="7" fill="#ffffff" stroke="#b42318" stroke-width="1.4"/>
<text x="610.0" y="36.0" font-size="14.5" text-anchor="middle" fill="#b42318" font-weight="bold">Payment</text>

<line x1="785" y1="50" x2="785" y2="532" stroke="#6e7781" stroke-width="1.0" stroke-dasharray="6 4"/>
<rect x="715" y="12" width="140" height="38" rx="7" fill="#ffffff" stroke="#1f2328" stroke-width="1.4"/>
<text x="785.0" y="36.0" font-size="14.5" text-anchor="middle" fill="#1f2328" font-weight="bold">Notification</text>

<line x1="80" y1="84" x2="250" y2="84" stroke="#1f2328" stroke-width="1.5" marker-end="url(#arrow-ink)"/>
<text x="165.0" y="77" font-size="12.5" text-anchor="middle" fill="#1f2328" font-weight="bold">1  POST /orders + Idempotency-Key</text>
<rect x="130.0" y="101" width="540" height="24" rx="5" fill="#f3f5f7" stroke="#1f2328" stroke-width="1.1"/>
<text x="400" y="118" font-size="12.5" text-anchor="middle" fill="#1f2328">2  save order (PENDING) and OrderPlaced in the outbox: one local transaction</text>
<line x1="250" y1="152" x2="80" y2="152" stroke="#6e7781" stroke-width="1.5" marker-end="url(#arrow-grey)"/>
<text x="165.0" y="145" font-size="12.5" text-anchor="middle" fill="#6e7781" font-weight="bold">3  201 Created (PENDING)</text>
<line x1="250" y1="194" x2="785" y2="194" stroke="#9a5b00" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow-amber)"/>
<polyline points="422,189 430,194 422,199" fill="none" stroke="#9a5b00" stroke-width="1.8"/>
<text x="340.0" y="187" font-size="12.5" text-anchor="middle" fill="#9a5b00" font-weight="bold">4  OrderPlaced</text>
<text x="697.5" y="187" font-size="12" text-anchor="middle" fill="#9a5b00" font-style="italic">(“order received” e-mail)</text>
<rect x="317.5" y="211" width="225.0" height="24" rx="5" fill="#f3f5f7" stroke="#1f2328" stroke-width="1.1"/>
<text x="430" y="228" font-size="12.5" text-anchor="middle" fill="#1f2328">5  reserve stock for order_id</text>
<line x1="430" y1="262" x2="610" y2="262" stroke="#9a5b00" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow-amber)"/>
<text x="520.0" y="255" font-size="12.5" text-anchor="middle" fill="#9a5b00" font-weight="bold">6  StockReserved</text>
<rect x="445.0" y="279" width="330" height="24" rx="5" fill="#f3f5f7" stroke="#1f2328" stroke-width="1.1"/>
<text x="610" y="296" font-size="12.5" text-anchor="middle" fill="#1f2328">7  charge via provider, idempotency key = order_id</text>
<line x1="14" y1="320" x2="866" y2="320" stroke="#1f2328" stroke-width="0.8"/>
<text x="20" y="338" font-size="12.5" text-anchor="start" fill="#1f2328" font-weight="bold">if payment succeeds</text>
<line x1="610" y1="368" x2="250" y2="368" stroke="#9a5b00" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow-amber)"/>
<polyline points="438,363 430,368 438,373" fill="none" stroke="#9a5b00" stroke-width="1.8"/>
<text x="520.0" y="361" font-size="12.5" text-anchor="middle" fill="#9a5b00" font-weight="bold">8a  PaymentAuthorised</text>
<line x1="610" y1="368" x2="785" y2="368" stroke="#9a5b00" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow-amber)"/>
<rect x="175.0" y="383" width="150" height="24" rx="5" fill="#f3f5f7" stroke="#1f2328" stroke-width="1.1"/>
<text x="250" y="400" font-size="12.5" text-anchor="middle" fill="#1f2328">order CONFIRMED</text>
<rect x="360.0" y="383" width="140" height="24" rx="5" fill="#f3f5f7" stroke="#1f2328" stroke-width="1.1"/>
<text x="430" y="400" font-size="12.5" text-anchor="middle" fill="#1f2328">reservation kept</text>
<rect x="710.0" y="383" width="150" height="24" rx="5" fill="#f3f5f7" stroke="#1f2328" stroke-width="1.1"/>
<text x="785" y="400" font-size="12.5" text-anchor="middle" fill="#1f2328">confirmation e-mail</text>
<line x1="14" y1="424" x2="866" y2="424" stroke="#b42318" stroke-width="0.8"/>
<text x="20" y="442" font-size="12.5" text-anchor="start" fill="#b42318" font-weight="bold">if payment is declined: compensating actions</text>
<line x1="610" y1="472" x2="250" y2="472" stroke="#b42318" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow-accent)"/>
<polyline points="438,467 430,472 438,477" fill="none" stroke="#b42318" stroke-width="1.8"/>
<text x="520.0" y="465" font-size="12.5" text-anchor="middle" fill="#b42318" font-weight="bold">8b  PaymentFailed</text>
<line x1="610" y1="472" x2="785" y2="472" stroke="#b42318" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow-accent)"/>
<rect x="175.0" y="489" width="150" height="24" rx="5" fill="#fdecea" stroke="#b42318" stroke-width="1.1"/>
<text x="250" y="506" font-size="12.5" text-anchor="middle" fill="#b42318">order CANCELLED</text>
<rect x="344.0" y="489" width="172" height="24" rx="5" fill="#fdecea" stroke="#b42318" stroke-width="1.1"/>
<text x="430" y="506" font-size="12.5" text-anchor="middle" fill="#b42318">release the reservation</text>
<rect x="699.0" y="489" width="172" height="24" rx="5" fill="#fdecea" stroke="#b42318" stroke-width="1.1"/>
<text x="785" y="506" font-size="12.5" text-anchor="middle" fill="#b42318">“payment failed” e-mail</text>
<text x="440" y="556" font-size="12.5" text-anchor="middle" fill="#6e7781" font-style="italic">If stock cannot be reserved, Inventory publishes StockReservationFailed and Order cancels the order (no payment is taken).</text>
<text x="440" y="576" font-size="12.5" text-anchor="middle" fill="#6e7781" font-style="italic">Every step is idempotent: events carry event_id and order_id, and a repeated event changes nothing.</text>
<line x1="220" y1="600" x2="260" y2="600" stroke="#9a5b00" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow-amber)"/>
<text x="266" y="604" font-size="12.5" text-anchor="start" fill="#1f2328">event through RabbitMQ</text>
<line x1="470" y1="600" x2="510" y2="600" stroke="#1f2328" stroke-width="1.5" marker-end="url(#arrow-ink)"/>
<text x="516" y="604" font-size="12.5" text-anchor="start" fill="#1f2328">synchronous HTTPS</text>
</svg>
